<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pablo Domínguez · Intupac</title>
<meta name="description" content="Tarjeta de presentación digital de Pablo Domínguez, Intupac – Industria de tubos y perfiles de acero.">
<meta property="og:title" content="Pablo Domínguez · Intupac">
<meta property="og:description" content="Industria de tubos y perfiles de acero">
<meta property="og:image" content="logo.png">
<meta name="theme-color" content="#004575">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#004575; --azul-osc:#00314f; --gris:#6b7c8c; --fondo:#eef2f5; --card:#ffffff; --texto:#1c2a36; --borde:#dbe3ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--fondo);color:var(--texto);
       min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 16px}
  .card{width:100%;max-width:420px;background:var(--card);border-radius:20px;overflow:hidden;
        box-shadow:0 10px 40px rgba(0,49,79,.15)}
  .logo{padding:28px 32px 22px;text-align:center;border-bottom:1px solid var(--borde)}
  .logo img{width:100%;max-width:260px;height:auto}
  .id{background:linear-gradient(135deg,var(--azul),var(--azul-osc));color:#fff;padding:26px 28px 24px;text-align:center}
  .id h1{font-size:30px;font-weight:700;letter-spacing:.3px}
  .id .cargo{font-size:17px;font-weight:500;opacity:.92;margin-top:4px}
  .id .empresa{font-size:13px;text-transform:uppercase;letter-spacing:1.4px;opacity:.7;margin-top:10px}
  .acciones{padding:22px 22px 8px;display:grid;gap:10px}
  .btn{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;text-decoration:none;
       color:var(--texto);border:1px solid var(--borde);font-size:16px;font-weight:500;background:#fff;transition:background .15s}
  .btn:hover{background:#f5f8fa}
  .btn svg{width:22px;height:22px;flex:none;color:var(--azul)}
  .btn small{display:block;color:var(--gris);font-size:13px;font-weight:400}
  .btn.principal{background:var(--azul);color:#fff;border-color:var(--azul);justify-content:center;font-weight:600;font-size:17px}
  .btn.principal svg{color:#fff}
  .btn.principal:hover{background:var(--azul-osc)}
  .qr{padding:18px 22px 26px;text-align:center}
  .qr img{width:180px;height:180px;border:1px solid var(--borde);border-radius:12px;padding:8px;background:#fff}
  .qr p{color:var(--gris);font-size:13px;margin-top:8px}
  footer{text-align:center;color:var(--gris);font-size:12px;padding:0 0 20px}
  footer a{color:var(--azul);text-decoration:none}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><img src="logo.png" alt="Intupac – Industria de tubos y perfiles de acero"></div>

  <div class="id">
    <h1>Pablo Domínguez</h1>
    <div class="cargo">Gerente Comercial</div>
    <div class="empresa">Intupac</div>
  </div>

  <div class="acciones">
    <a class="btn principal" href="pablo-dominguez.vcf" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      Guardar contacto
    </a>
    <a class="btn" href="tel:+56987232110">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
      <span>Llamar<small>+56 9 8723 2110</small></span>
    </a>
    <a class="btn" href="https://wa.me/56987232110" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.5A8.4 8.4 0 1 1 21 11.5z"/></svg>
      <span>WhatsApp<small>Enviar mensaje</small></span>
    </a>
    <a class="btn" href="mailto:pdominguez@intupac.cl">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
      <span>Correo<small>pdominguez@intupac.cl</small></span>
    </a>
    <a class="btn" href="https://www.intupac.cl" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span>Sitio web<small>www.intupac.cl</small></span>
    </a>
    <a class="btn" href="#" id="compartir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
      <span>Compartir tarjeta<small>Enviar enlace</small></span>
    </a>
  </div>

  <div class="qr">
    <img src="qr.png" alt="Código QR de esta tarjeta">
    <p>Escanea para abrir esta tarjeta</p>
  </div>

  <footer>Intupac · Industria de tubos y perfiles de acero</footer>
</main>
<script>
  document.getElementById('compartir').addEventListener('click', async e => {
    e.preventDefault();
    const data = {title: 'Pablo Domínguez · Intupac', url: location.href};
    try {
      if (navigator.share) { await navigator.share(data); }
      else { await navigator.clipboard.writeText(location.href); alert('Enlace copiado'); }
    } catch (_) {}
  });
</script>
</body>
</html>
